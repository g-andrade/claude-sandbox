# One sandbox instance. `claude-sandbox` sets the compose project name per project,
# HOST_UID/HOST_GID, and PROJECT_DIR, INSTANCE_DIR, INSTANCE_ID, DEV_PORT and
# DEV_BIND from instances/<id>/instance.env.
#
#   claude     -> the project's image (any base); runs Claude. Untrusted: its
#                 user, capabilities and network are all fixed here.
#   claude-net -> trusted; owns claude's network namespace on the internal
#                 network (no route out) and loads its firewall.
#   proxy      -> Squid; bridges the internal and egress networks, allows
#                 CONNECT only to allowlisted domains.
#   devport    -> relays a published host port to the dev server inside claude.
#
# The trusted containers (built from proxy/) load their own nftables egress
# firewall at startup (firewall/sandbox-init), then drop to an unprivileged
# user with no capabilities. The capabilities added below exist only for that.

x-firewall: &firewall
  image: claude-sandbox-proxy
  pull_policy: never
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    # Healthy once the firewall is loaded; `up --wait` and depends_on wait for it.
    test: ["CMD", "nft", "list", "table", "inet", "sandbox"]
    interval: 1m
    start_period: 30s
    start_interval: 1s

services:
  claude:
    image: claude-sandbox-claude:${INSTANCE_ID:?}
    pull_policy: never
    init: true
    entrypoint: ["sleep", "infinity"]
    user: "${HOST_UID:?}:${HOST_GID:?}"
    network_mode: service:claude-net
    depends_on:
      claude-net:
        condition: service_healthy
        restart: true
      proxy:
        condition: service_healthy
    working_dir: /workspace
    environment:
      HOME: /home/sandbox
      SHELL: /bin/bash
      HTTPS_PROXY: http://proxy:3128
      HTTP_PROXY: http://proxy:3128
      https_proxy: http://proxy:3128
      http_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      # Passed through from .env only when set there.
      CLAUDE_CODE_OAUTH_TOKEN:
      ANTHROPIC_API_KEY:
    volumes:
      - type: bind
        source: ${PROJECT_DIR:?}
        target: /workspace
      # Read-only overlays. .claude-sandbox holds the project's allowlist and
      # toolchain. All of .git, because git on the host executes what's in it
      # (config can set core.fsmonitor, hooks run on commit); overlaying only
      # config/hooks isn't enough, since .git itself could then be renamed
      # and replaced. Being mount points, neither can be renamed or deleted.
      - type: bind
        source: ${PROJECT_DIR}/.claude-sandbox
        target: /workspace/.claude-sandbox
        read_only: true
      - type: bind
        source: ${PROJECT_DIR}/.git
        target: /workspace/.git
        read_only: true
      # Claude's config and history, and dependency caches.
      - home:/home/sandbox
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 8g
    cpus: 4
    pids_limit: 2048

  claude-net:
    <<: *firewall
    hostname: sandbox
    entrypoint: ["sandbox-init", "claude", "nobody"]
    command: ["sleep", "infinity"]
    networks: [internal]
    mem_limit: 32m
    pids_limit: 16

  proxy:
    <<: *firewall
    volumes:
      # Shared allowlist, plus this instance's approved copy of the project's.
      - type: bind
        source: ./proxy
        target: /etc/squid/template
        read_only: true
      - type: bind
        source: ${INSTANCE_DIR:?}
        target: /etc/squid/instance
        read_only: true
    networks: [internal, egress]
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 256

  devport:
    <<: *firewall
    entrypoint: ["sandbox-init", "devport", "nobody"]
    command: ["socat", "TCP-LISTEN:5173,fork,reuseaddr", "TCP:claude-net:5173"]
    ports:
      - "${DEV_BIND:-127.0.0.1}:${DEV_PORT:?}:5173"
    networks: [internal, egress]
    mem_limit: 64m
    pids_limit: 128

networks:
  internal:
    internal: true
    enable_ipv6: false
  egress:
    enable_ipv6: false

volumes:
  home:
