# One sandbox instance. `sandbox` sets the compose project name per project
# and supplies PROJECT_DIR, INSTANCE_DIR, DEV_PORT and DEV_BIND from
# instances/<id>/instance.env.
#
#   claude  -> only on the internal network (no route out); reaches the
#              internet solely through the proxy's domain allowlist.
#   proxy   -> Squid; bridges the internal and egress networks, allows
#              CONNECT only to allowlisted domains.
#   devport -> relays a published host port to the dev server inside claude.
#
# Each container also loads its own nftables egress firewall at startup
# (firewall/sandbox-init), then drops to an unprivileged user with no
# capabilities. The capabilities added below exist only for that step.

x-firewall: &firewall
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    # Healthy once the firewall is loaded; `up --wait` and depends_on wait for it.
    test: ["CMD", "nft", "list", "table", "inet", "sandbox"]
    interval: 1m
    start_period: 30s
    start_interval: 1s

services:
  claude:
    <<: *firewall
    image: claude-sandbox-claude
    pull_policy: never
    hostname: sandbox
    init: true
    depends_on:
      proxy:
        condition: service_healthy
    networks: [internal]
    environment:
      HTTPS_PROXY: http://proxy:3128
      HTTP_PROXY: http://proxy:3128
      https_proxy: http://proxy:3128
      http_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      CLAUDE_CONFIG_DIR: /home/node/.claude
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      # Passed through from .env only when set there.
      CLAUDE_CODE_OAUTH_TOKEN:
      ANTHROPIC_API_KEY:
    volumes:
      - type: bind
        source: ${PROJECT_DIR:?}
        target: /workspace
      # Read-only overlays. .sandbox holds the project's allowlist. All of
      # .git, because git on the host executes what's in it (config can set
      # core.fsmonitor, hooks run on commit); overlaying only config/hooks
      # isn't enough, since .git itself could then be renamed and replaced.
      # Being mount points, neither can be renamed or deleted from inside.
      - type: bind
        source: ${PROJECT_DIR}/.sandbox
        target: /workspace/.sandbox
        read_only: true
      - type: bind
        source: ${PROJECT_DIR}/.git
        target: /workspace/.git
        read_only: true
      - claude-config:/home/node/.claude
    tmpfs:
      - /tmp
    mem_limit: 8g
    cpus: 4
    pids_limit: 2048

  proxy:
    <<: *firewall
    image: claude-sandbox-proxy
    pull_policy: never
    restart: unless-stopped
    volumes:
      # Shared allowlist, plus this instance's approved copy of the project's.
      - type: bind
        source: ./proxy
        target: /etc/squid/template
        read_only: true
      - type: bind
        source: ${INSTANCE_DIR:?}
        target: /etc/squid/instance
        read_only: true
    networks: [internal, egress]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 256

  devport:
    <<: *firewall
    image: claude-sandbox-proxy
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["sandbox-init", "devport", "nobody"]
    command: ["socat", "TCP-LISTEN:5173,fork,reuseaddr", "TCP:claude:5173"]
    ports:
      - "${DEV_BIND:-127.0.0.1}:${DEV_PORT:?}:5173"
    networks: [internal, egress]
    read_only: true
    mem_limit: 64m
    pids_limit: 128

networks:
  internal:
    internal: true
    enable_ipv6: false
  egress:
    enable_ipv6: false

volumes:
  claude-config:
